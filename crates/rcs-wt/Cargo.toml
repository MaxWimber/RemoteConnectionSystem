[package]
name = "rcs-wt"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Experimental video over WebTransport (P9-4, D-043). Started only by the agent's --webtransport flag.
[dependencies]
rcs-webrtc.workspace = true
ring = "0.17"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
wtransport = { version = "0.7", default-features = false, features = ["self-signed", "ring", "quinn"] }

[lints]
workspace = true
